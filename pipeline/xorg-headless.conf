# Headless GPU X server for verifier captures (no monitor, nothing on the desktop).
# Start once (needs root):
#   sudo Xorg :2 -config /home/marc/dev/graphics-gen/pipeline/xorg-headless.conf -sharevts -novtswitch -noreset -nolisten tcp -ac &
# then run captures with DISPLAY=:2 (CAPTURE_DISPLAY=:2 for the pipeline).
Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "AutoAddDevices" "false"
    Option "DontVTSwitch" "true"
EndSection

Section "Device"
    Identifier "nvidia-headless"
    Driver "nvidia"
    BusID "PCI:15:1:0"
    Option "AllowEmptyInitialConfiguration" "true"
    Option "UseDisplayDevice" "none"
EndSection

Section "Monitor"
    Identifier "virtual"
    HorizSync 28.0-80.0
    VertRefresh 48.0-75.0
EndSection

Section "Screen"
    Identifier "headless"
    Device "nvidia-headless"
    Monitor "virtual"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 1920 1080
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "layout"
    Screen "headless"
EndSection
