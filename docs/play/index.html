<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Scene Studio</title>
		<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: white; background: #0b2a55; overflow: hidden; touch-action: none; font-family: 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, sans-serif; }
#canvas { display: block; }
#canvas:focus { outline: none; }

#status {
	position: absolute; inset: 0;
	display: flex; flex-direction: column; justify-content: center; align-items: center;
	visibility: hidden;
	background: linear-gradient(180deg, #1552b8 0%, #3f8fe0 42%, #9ed6ee 58%, #c9b48a 60%, #b39a70 100%);
	transition: opacity 0.6s ease;
}
#status.fade { opacity: 0; }
#status-splash { display: none; }
.sun {
	position: absolute; top: 12%; right: 16%; width: 9vmin; height: 9vmin; border-radius: 50%;
	background: #fff3c4; box-shadow: 0 0 6vmin 2vmin rgba(255, 240, 180, 0.7);
}
.foam {
	position: absolute; left: 0; right: 0; top: 57.5%; height: 2.5%;
	background: repeating-linear-gradient(90deg, rgba(255,255,255,0.9) 0 6vmin, rgba(255,255,255,0.35) 6vmin 11vmin);
	filter: blur(2px);
}
.card {
	position: relative; text-align: center; padding: 2.2rem 3rem; border-radius: 1.2rem;
	background: rgba(6, 30, 70, 0.55); backdrop-filter: blur(6px); box-shadow: 0 1rem 3rem rgba(0,0,0,0.35);
	max-width: 32rem;
}
.card h1 { margin: 0 0 0.3rem; font-size: 2.4rem; letter-spacing: 0.08em; font-weight: 700; }
.card p { margin: 0.2rem 0; color: #dce9ff; font-size: 0.95rem; line-height: 1.4; }
.card .hint { margin-top: 1rem; font-size: 0.85rem; color: #ffe9b3; }
.card .hint b { color: #fff; }
#status-progress {
	appearance: none; -webkit-appearance: none; width: 100%; height: 0.55rem; margin-top: 1.4rem;
	border: 0; border-radius: 1rem; overflow: hidden; background: rgba(255,255,255,0.18); display: none;
}
#status-progress::-webkit-progress-bar { background: rgba(255,255,255,0.18); }
#status-progress::-webkit-progress-value { background: linear-gradient(90deg, #ffd166, #ff7a59); }
#status-progress::-moz-progress-bar { background: linear-gradient(90deg, #ffd166, #ff7a59); }
#status-progress:indeterminate::-webkit-progress-value { background: rgba(255,255,255,0.4); }
#status-label { margin-top: 0.5rem; font-size: 0.8rem; color: #cfe2ff; min-height: 1em; }
#status-notice {
	display: none; margin-top: 1rem; padding: 0.8rem 1rem; border-radius: 0.6rem;
	background: rgba(120, 30, 40, 0.75); color: #ffe6e6; font-size: 0.9rem; text-align: left; white-space: pre-line;
}
.credit { position: absolute; bottom: 1.2rem; left: 0; right: 0; text-align: center; font-size: 0.75rem; color: rgba(255,255,255,0.75); }
.credit a { color: #fff; }
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
		<noscript>Your browser does not support JavaScript.</noscript>

		<div id="status">
			<div class="sun"></div>
			<div class="foam"></div>
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<div class="card">
				<h1>BEACH WALK</h1>
				<p>A procedural shoreline built layer by layer in Godot.</p>
				<p class="hint"><b>Up</b> faster &nbsp; <b>Down</b> slower &nbsp; <b>Left / Right</b> steer &nbsp; <b>Space</b> jump &nbsp; <b>Drag</b> look around</p>
				<progress id="status-progress"></progress>
				<div id="status-label">Loading engine…</div>
				<div id="status-notice"></div>
			</div>
			<div class="credit">Bodies and animations: Quaternius (CC0) · Built with Godot 4</div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":27302332,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusLabel = document.getElementById('status-label');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			// keep the page up a moment so the first frames render behind it, then fade
			statusLabel.textContent = 'Building the beach…';
			setTimeout(() => {
				statusOverlay.classList.add('fade');
				setTimeout(() => statusOverlay.remove(), 700);
			}, 900);
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		statusNotice.textContent = text;
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => { setTimeout(() => resolve(), 2000); }),
			]).then(() => { window.location.reload(); }).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'This browser is missing features needed to run the scene:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					statusLabel.textContent = 'Loading engine… ' + Math.round(100 * current / total) + '%';
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
